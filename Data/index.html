<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language AI – Live Display</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #080d14;
            --surface:   #0e1623;
            --border:    #1c2e45;
            --accent:    #38bdf8;
            --accent2:   #a78bfa;
            --green:     #34d399;
            --red:       #f87171;
            --text:      #e2e8f0;
            --muted:     #4a6585;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px 40px;
            background-image:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,189,248,.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 90% 80%, rgba(167,139,250,.05) 0%, transparent 60%);
        }

        /* ─── HEADER ─────────────────────────────────────── */
        header {
            width: 100%;
            max-width: 860px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logo-text h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.3px; }
        .logo-text p  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

        .ws-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            background: var(--surface);
            transition: border-color .3s;
        }
        .ws-pill.ok  { border-color: var(--green); color: var(--green); }
        .ws-pill.err { border-color: var(--red);   color: var(--red); }

        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--red);
            transition: background .3s, box-shadow .3s;
        }
        .dot.on {
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }

        /* ─── MAIN GRID ──────────────────────────────────── */
        .grid {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ─── CARD ───────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 28px 24px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,.025) 0%, transparent 60%);
        }

        .card-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }
        .card-label i { font-size: 10px; color: var(--accent); }

        /* ─── RECORDING INDICATOR ────────────────────────── */
        #rec-badge {
            display: none;
            align-items: center;
            gap: 6px;
            position: absolute;
            top: 22px; right: 22px;
            background: rgba(248,113,113,.15);
            border: 1px solid rgba(248,113,113,.4);
            color: var(--red);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            animation: recpulse 1s infinite;
        }
        #rec-badge.show { display: flex; }
        @keyframes recpulse { 0%,100%{opacity:1} 50%{opacity:.45} }

        /* ─── KEYWORDS ───────────────────────────────────── */
        #keywords-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 56px;
            align-items: center;
        }

        .empty-hint {
            color: var(--muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .kw-tag {
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(56,189,248,.1);
            border: 1px solid rgba(56,189,248,.35);
            color: var(--accent);
            animation: pop .25s cubic-bezier(.34,1.56,.64,1) both;
        }
        .kw-tag:last-child {
            background: rgba(167,139,250,.15);
            border-color: rgba(167,139,250,.5);
            color: var(--accent2);
        }
        @keyframes pop {
            from { transform: scale(.7); opacity: 0; }
            to   { transform: scale(1);  opacity: 1; }
        }

        /* ─── CONFIDENCE BAR ─────────────────────────────── */
        .conf-row {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .conf-label {
            font-size: 0.72rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
            width: 70px;
            flex-shrink: 0;
        }
        .conf-track {
            flex: 1;
            height: 5px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
        }
        .conf-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width .4s ease;
            width: 0%;
        }
        .conf-val {
            font-size: 0.72rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            width: 40px;
            text-align: right;
        }

        /* ─── TRANSLATION ────────────────────────────────── */
        .translation-card {
            border-color: rgba(56,189,248,.2);
            background: linear-gradient(135deg, rgba(56,189,248,.04), var(--surface));
        }

        #translation-text {
            font-size: clamp(1.35rem, 3vw, 1.85rem);
            font-weight: 700;
            line-height: 1.45;
            color: var(--text);
            min-height: 72px;
            display: flex;
            align-items: center;
        }
        #translation-text.is-empty { color: var(--muted); font-weight: 400; font-size: 0.9rem; font-style: italic; }
        #translation-text.appear {
            animation: fadeUp .4s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .timer-row {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.75rem;
        }
        #countdown-bar-wrap {
            flex: 1;
            height: 3px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
        }
        #countdown-bar {
            height: 100%;
            background: var(--accent2);
            border-radius: 999px;
            width: 0%;
            transition: width .1s linear;
        }

        /* ─── FOOTER ─────────────────────────────────────── */
        footer {
            margin-top: 32px;
            font-size: 0.7rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">🤟</div>
        <div class="logo-text">
            <h1>Sign Language AI</h1>
            <p>ESP32-CAM · MediaPipe · Gemini</p>
        </div>
    </div>
    <div class="ws-pill" id="ws-pill">
        <div class="dot" id="ws-dot"></div>
        <span id="ws-text">Đang kết nối...</span>
    </div>
</header>

<div class="grid">

    <!-- Card 1: Keywords -->
    <div class="card">
        <div class="card-label"><i class="fas fa-hand-sparkles"></i> Từ khóa nhận diện</div>
        <div id="rec-badge"><i class="fas fa-circle" style="font-size:8px"></i> Đang thu hình</div>
        <div id="keywords-wrap">
            <span class="empty-hint">Chưa nhận được tín hiệu...</span>
        </div>
        <div class="conf-row">
            <span class="conf-label">Confidence</span>
            <div class="conf-track"><div class="conf-fill" id="conf-fill"></div></div>
            <span class="conf-val" id="conf-val">—</span>
        </div>
    </div>

    <!-- Card 2: Translation -->
    <div class="card translation-card">
        <div class="card-label"><i class="fas fa-wand-magic-sparkles"></i> Gemini dịch (sau 3s rảnh tay)</div>
        <div id="translation-text" class="is-empty">Đang chờ câu hoàn chỉnh...</div>
        <div class="timer-row">
            <span id="timer-label">Thời gian chờ</span>
            <div id="countdown-bar-wrap">
                <div id="countdown-bar"></div>
            </div>
        </div>
    </div>

</div>

<footer>Kết nối tới <code id="ws-addr"></code></footer>

<script>
    // ── Cấu hình ────────────────────────────────────────────────────
    // Đổi sang địa chỉ ngrok hoặc IP server khi deploy thực tế
    const WS_URL = "ws://127.0.0.1:8000/ws/sign-language";
    const PAUSE_THRESHOLD_MS = 3000; // phải khớp với server.py

    document.getElementById('ws-addr').textContent = WS_URL;

    // ── DOM refs ─────────────────────────────────────────────────────
    const dot          = document.getElementById('ws-dot');
    const pill         = document.getElementById('ws-pill');
    const wsText       = document.getElementById('ws-text');
    const recBadge     = document.getElementById('rec-badge');
    const kwWrap       = document.getElementById('keywords-wrap');
    const confFill     = document.getElementById('conf-fill');
    const confVal      = document.getElementById('conf-val');
    const transText    = document.getElementById('translation-text');
    const countBar     = document.getElementById('countdown-bar');
    const timerLabel   = document.getElementById('timer-label');

    // ── Countdown animation ──────────────────────────────────────────
    let countdownTimer = null;
    let countdownStart = 0;

    function startCountdown() {
        stopCountdown();
        countdownStart = Date.now();
        countBar.style.width = '0%';
        timerLabel.textContent = 'Dịch sau…';
        countdownTimer = setInterval(() => {
            const elapsed = Date.now() - countdownStart;
            const pct = Math.min((elapsed / PAUSE_THRESHOLD_MS) * 100, 100);
            countBar.style.width = pct + '%';
            if (pct >= 100) stopCountdown();
        }, 80);
    }

    function stopCountdown() {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countBar.style.width = '0%';
        timerLabel.textContent = 'Thời gian chờ';
    }

    // ── Confidence bar ───────────────────────────────────────────────
    function setConf(val) {
        const pct = (val * 100).toFixed(1);
        confFill.style.width = pct + '%';
        confVal.textContent  = pct + '%';
    }

    // ── WebSocket ────────────────────────────────────────────────────
    let ws;

    function connect() {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            dot.classList.add('on');
            pill.classList.add('ok');
            pill.classList.remove('err');
            wsText.textContent = 'Đã kết nối Server';
        };

        ws.onclose = () => {
            dot.classList.remove('on');
            pill.classList.remove('ok');
            pill.classList.add('err');
            wsText.textContent = 'Mất kết nối – thử lại...';
            setTimeout(connect, 2000);
        };

        ws.onmessage = ({ data }) => {
            const msg = JSON.parse(data);

            if (msg.event === 'recording_start') {
                recBadge.classList.add('show');
            }

            else if (msg.event === 'recording_stop') {
                recBadge.classList.remove('show');
            }

            else if (msg.event === 'word_detected') {
                // Vẽ lại toàn bộ tag từ khóa
                kwWrap.innerHTML = msg.keywords
                    .map((kw, i) => `<span class="kw-tag">${kw}</span>`)
                    .join('');

                // Cập nhật confidence cho từ vừa nhận
                if (msg.confidence != null) setConf(msg.confidence);

                // Đặt lại countdown
                startCountdown();

                // Reset vùng dịch
                transText.className = 'is-empty';
                transText.textContent = 'Đang chờ ngắt câu để dịch...';
            }

            else if (msg.event === 'translation_success') {
                stopCountdown();
                transText.textContent = msg.natural_sentence;
                transText.className = 'appear';
                // Xóa class animation sau khi chạy xong để có thể trigger lại
                transText.addEventListener('animationend', () => {
                    transText.classList.remove('appear');
                }, { once: true });
            }

            else if (msg.event === 'low_confidence') {
                recBadge.classList.remove('show');
            }
        };
    }

    connect();
</script>
</body>
</html>
